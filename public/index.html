<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#161616">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="referrer" content="no-referrer">
<title>Orbit Share</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="stylesheet" href="style.css">
<script src="vendor/jsQR.js" defer></script>
<script src="protocol.js" defer></script>
<script src="app.js" defer></script>
<main>
  <header><img src="icon.svg" width="32" height="32" alt=""><h1>Orbit Share</h1><button id="scan">Scan QR</button></header>
  <section id="camera" hidden><video playsinline muted></video><button id="cancel-scan">Cancel</button></section>
  <p id="status" role="status" aria-live="polite">Scan the QR on your computer.</p>
  <p id="offline"><small>Add to Home Screen for offline use.</small></p>
  <button id="install" hidden>Install</button>
  <section id="paired" aria-label="Paired computers"></section>
  <div id="connected" hidden>
    <section id="items"></section>
    <h2>Send to Orbit</h2>
    <form id="files">
      <label for="upload">Files <small>Up to 1 GiB each</small></label>
      <input id="upload" type="file" multiple required>
      <button>Send files</button>
    </form>
    <form id="text">
      <label for="message">Text or link</label>
      <textarea id="message" placeholder="Paste here" required></textarea>
      <button>Send</button>
    </form>
  </div>
</main>
</html>
